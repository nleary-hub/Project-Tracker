name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

  database:
    name: Database (migrations + RLS tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: supabase test db

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start local Supabase (applies migrations and seed.sql)
        run: |
          supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,realtime,storage-api
          # `status -o env` quotes its values and the key names have changed across CLI
          # versions (ANON_KEY → PUBLISHABLE_KEY), so read them defensively.
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          echo "status keys: $(cut -d= -f1 "$RUNNER_TEMP/supabase.env" | tr '\n' ' ')"
          read_var() { grep -E "^($1)=" "$RUNNER_TEMP/supabase.env" | head -n1 | cut -d= -f2- | tr -d '"'; }
          url=$(read_var 'API_URL|SUPABASE_URL')
          key=$(read_var 'PUBLISHABLE_KEY|SUPABASE_PUBLISHABLE_KEY|ANON_KEY|SUPABASE_ANON_KEY')
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::error::could not read the local Supabase URL/key from 'supabase status -o env'"
            exit 1
          fi
          echo "LOCAL_SUPABASE_URL=$url" >> "$GITHUB_ENV"
          echo "LOCAL_SUPABASE_KEY=$key" >> "$GITHUB_ENV"
      - name: Build and run Playwright against the production server
        run: |
          pnpm build
          pnpm exec playwright test
        env:
          CI: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.LOCAL_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.LOCAL_SUPABASE_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
